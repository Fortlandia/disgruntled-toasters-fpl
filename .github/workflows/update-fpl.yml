name: Update FPL Data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch FPL data
        run: python fetch_fpl.py
  
      - name: Build Premier League intelligence
        run: python league_intelligence.py

      - name: Calculate opponent strength
        run: python opponent_strength.py

      - name: Optimize GW lineup (Version 3)
        run: python lineup_optimizer_v3.py
        
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update FPL data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
