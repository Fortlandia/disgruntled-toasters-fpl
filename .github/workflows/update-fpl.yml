name: Update FPL Data

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install Python dependencies
        run: python -m pip install requests          

      - name: Fetch FPL data
        run: python fetch_fpl.py
  
      - name: Build Premier League intelligence
        run: python league_intelligence.py

      - name: Calculate opponent strength
        run: python opponent_strength.py

      - name: Optimize GW lineup (Version 3)
        run: python lineup_optimizer_v3.py

      - name: Analyze playing time and rotation
        run: python minutes_intelligence.py
        
      - name: Optimize GW lineup (Version 4)
        run: python lineup_optimizer_v4.py     

      - name: Fetch Champions League Calendar
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python fetch_football_calendar.py

      - name: Fetch ESPN Cup Calendar
        run: python fetch_espn_calendar.py

      - name: Build Toasters Fixture Intelligence
        run: python fixture_intelligence.py        
        
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update FPL data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
